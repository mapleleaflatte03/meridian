name: Meridian Monorepo CI

on:
  push:
    branches: [main]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      loom: ${{ steps.filter.outputs.loom }}
      kernel: ${{ steps.filter.outputs.kernel }}
      intelligence: ${{ steps.filter.outputs.intelligence }}
      bootstrap: ${{ steps.filter.outputs.bootstrap }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            loom:
              - 'loom/**'
            kernel:
              - 'kernel/**'
            intelligence:
              - 'intelligence/**'
            bootstrap:
              - 'scripts/**'
              - 'README.md'
              - 'docs/**'

  loom-rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: loom
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: loom
      - name: Test loom workspace
        run: cargo test --workspace

  python-kernel-intelligence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
          python3 -m pip install --upgrade pip
          python3 -m pip install mcp

      - name: Kernel tests
        run: |
          cd kernel
          python3 -m unittest discover -s kernel/tests -p 'test_*.py'
          python3 -m unittest discover -s economy/tests -p 'test_*.py'

      - name: Intelligence tests
        run: |
          cd intelligence
          python3 -m unittest -v test_gateway_brain_router.py
          ./scripts/acceptance_publish_live_lane.sh
          cd company/meridian_platform
          python3 -m unittest -v test_subscription_service.py

  onboarding-ready-lane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install onboarding dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install mcp

      - name: Onboarding ready-to-run lane
        run: |
          ./scripts/acceptance_onboarding_ready_lane.sh
