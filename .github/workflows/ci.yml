name: Meridian Monorepo CI

on:
  push:
    branches: [main]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      loom: ${{ steps.filter.outputs.loom }}
      kernel: ${{ steps.filter.outputs.kernel }}
      intelligence: ${{ steps.filter.outputs.intelligence }}
      bootstrap: ${{ steps.filter.outputs.bootstrap }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            loom:
              - 'loom/**'
            kernel:
              - 'kernel/**'
            intelligence:
              - 'intelligence/**'
            bootstrap:
              - 'scripts/**'
              - 'README.md'
              - 'docs/**'

  loom-rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: loom
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: loom
      - name: Test loom workspace
        run: |
          export MERIDIAN_TEST_KERNEL_PATH="${GITHUB_WORKSPACE}/kernel"
          cargo test --workspace

  python-kernel-intelligence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
          python3 -m pip install --upgrade pip
          python3 -m pip install mcp

      - name: Kernel tests
        run: |
          cd kernel
          python3 -m unittest discover -s kernel/tests -p 'test_*.py'
          python3 -m unittest discover -s economy/tests -p 'test_*.py'

      - name: Intelligence tests
        run: |
          cd intelligence
          python3 -m unittest -v test_gateway_brain_router.py
          # External testing domain app.welliam.codes has been repurposed (returns 403)
          # ./scripts/acceptance_publish_live_lane.sh
          cd company/meridian_platform
          PYTHONPATH=. python3 -m unittest -v test_subscription_service.py

  onboarding-ready-lane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install onboarding dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install mcp

      - name: Onboarding ready-to-run lane
        run: |
          ./scripts/acceptance_onboarding_ready_lane.sh

  deploy-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Prevents the "bumped .css?v= in some files, forgot others" failure
      # class that leaves live browsers on stale CSS/JS cache entries.
      - name: Asset version drift gate
        run: python3 scripts/ci/check_asset_versions.py

      # Prevents regression to a Team-collapsible dashboard shell where
      # governance controls leak back into the Core cockpit.
      - name: Dashboard Core/Team contract gate
        run: python3 scripts/ci/check_dashboard_contract.py

      # Protects homepage focus, prevents commercial wording re-drift,
      # and enforces the 60KB warehouse-regression ceiling.
      - name: Website product contract gate
        run: python3 scripts/ci/check_website_contract.py

      # Protects README doorway ordering: identity→install→onboarding→core/team→first-commands.
      # Prevents README becoming a warehouse or losing the front door.
      - name: README doorway contract gate
        run: python3 scripts/ci/check_readme_contract.py

      # Outcome-based UI anatomy checks. No longer enforces legacy homepage
      # section IDs; instead protects structural truth, semantic truth, and focus.
      # API status check is skipped in CI because no gateway server runs in this
      # job; the onboarding-ready-lane validates the full live stack separately.
      - name: UI anatomy contract gate
        run: ./scripts/acceptance_ui_anatomy_lane.sh
        env:
          MERIDIAN_ALLOW_API_SKIP: '1'
